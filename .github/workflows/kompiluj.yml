name: Kompiluj Autorski System ISO

on:
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v3

      - name: Zainstaluj kompilatory (NASM, GCC, GRUB, xorriso)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc gcc-multilib grub-pc-bin xorriso mtools

      - name: Kompilacja Asemblera i C
        run: |
          nasm -f elf32 boot.asm -o boot.o
          gcc -m32 -c kernel.c -o kernel.o -std=gnu99 -ffreestanding -O2 -Wall
          ld -m elf_i386 -T linker.ld -o myos.bin boot.o kernel.o

      - name: Pakowanie do pliku ISO
        run: |
          mkdir -p isodir/boot/grub
          cp myos.bin isodir/boot/myos.bin
          cp grub.cfg isodir/boot/grub/grub.cfg
          grub-mkrescue -o moj-autorski-system.iso isodir

      - name: Udostępnij plik ISO do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Moj-Autorski-System-ISO
          path: moj-autorski-system.iso
